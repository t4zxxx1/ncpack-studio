name: 🐞 Bug report · Segnala un problema
description: Something doesn't work as expected · Qualcosa non funziona come dovrebbe
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't attach videos or courses you can't share publicly**: describe them instead.
        Grazie della segnalazione! **Non allegare video o corsi che non puoi condividere pubblicamente**: descrivili.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Video compression · Compressione video
        - Size estimate · Stima del peso
        - SCORM Lightener · Alleggerisci SCORM
        - Licence / activation · Licenza / attivazione
        - Installation · Installazione
        - Other · Altro
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened? · Cosa è successo?
      description: Include the exact error message, if any · Riporta il messaggio di errore esatto, se c'è
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? · Cosa ti aspettavi?
  - type: textarea
    id: file
    attributes:
      label: The file · Il file
      description: Format, resolution, duration, size, where it comes from (phone, camera, Articulate…) · Formato, risoluzione, durata, peso, provenienza
      placeholder: "MOV, 3840×2160, 2:30, 1.2 GB, iPhone 15 Pro (HEVC 10-bit)"
  - type: input
    id: version
    attributes:
      label: App version · Versione dell'app
      description: Shown at the bottom of the settings panel · In fondo al pannello delle impostazioni
      placeholder: "1.0.21"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System · Sistema
      options:
        - macOS (Apple silicon)
        - Windows 64-bit
    validations:
      required: true
  - type: input
    id: osversion
    attributes:
      label: System version · Versione del sistema
      placeholder: "macOS 15.4 / Windows 11 24H2"
